; ============================================================================
;  udptl.conf — T.38 fax transport (UDPTL). Range should be opened on the
;  firewall like the RTP range. Used by ReceiveFAX/SendFAX over T.38.
; ============================================================================
[general]
udptlstart=4000
udptlend=4999
udptlchecksums=no
udptlfecentries=3
udptlfecspan=3
use_even_ports=yes
