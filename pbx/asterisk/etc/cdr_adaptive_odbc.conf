; ============================================================================
;  cdr_adaptive_odbc.conf — write CDRs to the `cdr` table over the openpbx
;  ODBC context. "Adaptive" means any CDR variable whose name matches a
;  column gets stored, so our custom columns (tenant_id, did, direction,
;  recording) are persisted because the dialplan sets them via CDR(<name>).
; ============================================================================
[openpbx_cdr]
connection = openpbx
table = cdr
; map a couple of names where the column differs from the CDR variable
alias start => calldate
