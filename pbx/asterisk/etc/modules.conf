; ============================================================================
;  modules.conf — load only what a multi-tenant PJSIP + realtime PBX needs.
; ============================================================================
[modules]
autoload = yes

; --- We manage CDR via adaptive ODBC; disable the others to avoid dupes ----
noload = cdr_csv.so
noload = cdr_sqlite3_custom.so
noload = cdr_manager.so

; --- chan_sip is legacy; we use chan_pjsip exclusively ---------------------
noload = chan_sip.so

; --- Make sure the realtime + ODBC stack loads early -----------------------
; (autoload=yes brings in res_pjsip*, func_odbc, app_queue, app_voicemail,
;  res_sorcery_realtime, res_fax/res_fax_spandsp, app_fax, etc. We only force
;  ODBC to come up first.)
preload = res_odbc.so
preload = res_config_odbc.so

; --- Fax (T.38 + spandsp). autoload pulls these in; listed for clarity. -----
; res_fax.so + res_fax_spandsp.so provide ReceiveFAX/SendFAX dialplan apps.
load = res_fax.so
load = res_fax_spandsp.so
