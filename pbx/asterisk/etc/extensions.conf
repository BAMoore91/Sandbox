; ============================================================================
;  extensions.conf — multi-tenant dialplan.
; ----------------------------------------------------------------------------
;  Tenancy model
;  -------------
;   * Phone endpoints set channel vars on origination (ps_endpoints.set_var):
;         TENANT=<slug>   MYEXTEN=<own extension>
;     so [from-internal] always knows which company a call belongs to.
;   * SIP trunks land in [from-twilio]; the dialed DID is resolved to a
;     tenant + destination via the database, then dispatched.
;   * Endpoint ids are globally unique: "<slug>-<ext>" and "trunk-<id>".
;
;  Generic destination dispatch
;  ----------------------------
;   Set DEST_VALUE, then Goto(dispatch,<DEST_TYPE>,1). DEST_TYPE is used as
;   the extension name in [dispatch], which forwards to the right handler.
;   This single mechanism powers DIDs, IVR options, ring-group failover and
;   time-condition branches — exactly like 3CX's "destination" dropdowns.
; ============================================================================

[globals]
DIAL_OPTS = tT          ; allow in-call transfer for both parties
MONITOR_BASE = /var/spool/asterisk/monitor

; ----------------------------------------------------------------------------
;  Call recording subroutine — GoSub(start-recording,s,1) once per call.
;  No-op unless the tenant has recording enabled. Starts MixMonitor (mixes
;  both legs), files under monitor/<tenant>/<date>/<uniqueid>.wav, records the
;  relative path in CDR(recording), and catalogs it in the recordings table.
;  Guarded by __RECSTARTED so it only fires once even if a call re-enters.
; ----------------------------------------------------------------------------
[start-recording]
exten => s,1,GotoIf($["${RECSTARTED}" = "1"]?done)
 same => n,ExecIf($["${TENANT}" = ""]?Return())
 same => n,GotoIf($["${ODBC_REC_ENABLED(${TENANT})}" != "1"]?done)
 same => n,Set(__RECSTARTED=1)
 same => n,Set(REC_REL=${TENANT}/${STRFTIME(${EPOCH},,%Y/%m/%d)}/${UNIQUEID}.wav)
 same => n,Set(REC_DIR=${MONITOR_BASE}/${TENANT}/${STRFTIME(${EPOCH},,%Y/%m/%d)})
 same => n,System(mkdir -p ${REC_DIR})
 same => n,Set(CDR(recording)=${REC_REL})
 same => n,MixMonitor(${MONITOR_BASE}/${REC_REL},b)
 same => n,Set(ODBC_REC_INSERT(${UNIQUEID},${REC_REL},${CALLERID(num)},${EXTEN})=${ODBC_TENANT_ID(${TENANT})})
 same => n(done),Return()

; ----------------------------------------------------------------------------
;  Destination dispatcher
; ----------------------------------------------------------------------------
[dispatch]
exten => extension,1,Goto(ext-dial,${DEST_VALUE},1)
exten => ringgroup,1,Goto(ringgroup-exec,${DEST_VALUE},1)
exten => queue,1,Goto(queue-exec,${DEST_VALUE},1)
exten => ivr,1,Goto(ivr-exec,${DEST_VALUE},1)
exten => voicemail,1,Goto(vm-exec,${DEST_VALUE},1)
exten => timecondition,1,Goto(tc-exec,${DEST_VALUE},1)
exten => external,1,Goto(outbound,${DEST_VALUE},1)
exten => playback,1,Goto(playback-exec,${DEST_VALUE},1)
exten => hangup,1,Hangup()
exten => _.,1,Hangup()            ; unknown type -> drop

; ----------------------------------------------------------------------------
;  Inbound from SIP trunks (Twilio Origination)
; ----------------------------------------------------------------------------
[from-twilio]
exten => _[+0-9].,1,NoOp(Inbound to ${EXTEN} via ${CHANNEL(endpoint)})
 same => n,Set(DID=${EXTEN})
 same => n,Set(DI=${ODBC_DID_INFO(${DID})})
 ; Twilio usually sends E.164 with leading '+'; retry with '+' if not found
 same => n,ExecIf($["${DI}" = "" & "${DID:0:1}" != "+"]?Set(DID=+${DID}))
 same => n,ExecIf($["${DI}" = ""]?Set(DI=${ODBC_DID_INFO(${DID})}))
 same => n,GotoIf($["${DI}" = ""]?unknown)
 same => n,Set(TENANT=${CUT(DI,^,1)})
 same => n,Set(DEST_TYPE=${CUT(DI,^,2)})
 same => n,Set(DEST_VALUE=${CUT(DI,^,3)})
 same => n,Set(CDR(tenant_id)=${ODBC_TENANT_ID(${TENANT})})
 same => n,Set(CDR(did)=${DID})
 same => n,Set(CDR(direction)=inbound)
 same => n,Set(__TENANT=${TENANT})          ; inherit to child channels
 same => n,GoSub(start-recording,s,1)
 same => n,Goto(dispatch,${DEST_TYPE},1)
 same => n(unknown),NoOp(No route for DID ${DID})
 same => n,Playback(ss-noservice)
 same => n,Hangup()

; ----------------------------------------------------------------------------
;  Internal phones
; ----------------------------------------------------------------------------
[from-internal]
; ---- Feature codes --------------------------------------------------------
exten => *97,1,VoiceMailMain(${MYEXTEN}@${TENANT})      ; my mailbox
 same => n,Hangup()
exten => *98,1,VoiceMailMain(@${TENANT})                ; login to any mailbox
 same => n,Hangup()
exten => *43,1,Answer()                                  ; echo test
 same => n,Echo()
 same => n,Hangup()

; ---- Emergency (always allowed, routed out the trunk) ---------------------
exten => 911,1,Goto(outbound,911,1)
exten => 933,1,Goto(outbound,933,1)

; ---- Internal numbers: extensions, ring groups, queues, IVRs, TCs ---------
exten => _XXX,1,Goto(internal-num,${EXTEN},1)
exten => _XXXX,1,Goto(internal-num,${EXTEN},1)
exten => _XXXXX,1,Goto(internal-num,${EXTEN},1)

; ---- Outbound (PSTN via trunk) --------------------------------------------
exten => _+X.,1,Goto(outbound,${EXTEN},1)
exten => _NXXNXXXXXX,1,Goto(outbound,${EXTEN},1)
exten => _1NXXNXXXXXX,1,Goto(outbound,${EXTEN},1)
exten => _011.,1,Goto(outbound,${EXTEN},1)
exten => _00.,1,Goto(outbound,${EXTEN},1)

; Resolve an internal number to whatever object owns it (in tenant scope).
[internal-num]
exten => _X.,1,NoOp(Internal ${EXTEN} for tenant ${TENANT})
 same => n,Set(CDR(direction)=internal)
 same => n,GoSub(start-recording,s,1)
 same => n,GotoIf($["${ODBC_EXT_INFO(${TENANT},${EXTEN})}" != ""]?ext)
 same => n,GotoIf($["${ODBC_RG_INFO(${TENANT},${EXTEN})}" != ""]?rg)
 same => n,GotoIf($["${ODBC_QUEUE_EXISTS(${TENANT},${EXTEN})}" != ""]?queue)
 same => n,GotoIf($["${ODBC_IVR_INFO(${TENANT},${EXTEN})}" != ""]?ivr)
 same => n,GotoIf($["${ODBC_TC_INFO(${TENANT},${EXTEN})}" != ""]?tc)
 same => n,Playback(pbx-invalid)
 same => n,Hangup()
 same => n(ext),Goto(ext-dial,${EXTEN},1)
 same => n(rg),Goto(ringgroup-exec,${EXTEN},1)
 same => n(queue),Goto(queue-exec,${EXTEN},1)
 same => n(ivr),Goto(ivr-exec,${EXTEN},1)
 same => n(tc),Goto(tc-exec,${EXTEN},1)

; ----------------------------------------------------------------------------
;  Dial a single extension (with DND, call-forward and voicemail fallback)
; ----------------------------------------------------------------------------
[ext-dial]
exten => _X.,1,NoOp(Dial extension ${EXTEN} @ ${TENANT})
 same => n,Set(EI=${ODBC_EXT_INFO(${TENANT},${EXTEN})})
 same => n,GotoIf($["${EI}" = ""]?invalid)
 same => n,Set(RINGT=${CUT(EI,^,1)})
 same => n,Set(VMEN=${CUT(EI,^,2)})
 same => n,Set(CFWD=${CUT(EI,^,3)})
 same => n,Set(DND=${CUT(EI,^,4)})
 same => n,Set(TARGET=${EXTEN})
 same => n,GotoIf($["${DND}" = "1"]?vm)
 same => n,ExecIf($["${CFWD}" != ""]?Goto(from-internal,${CFWD},1))
 same => n,Dial(PJSIP/${TENANT}-${EXTEN},${RINGT},${DIAL_OPTS})
 same => n,NoOp(DIALSTATUS=${DIALSTATUS})
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 ; not answered: notify missed call (caller = inbound CID), then voicemail
 same => n,Set(ODBC_NOTIFY(${TENANT},${TARGET},missed,${CDR(did)})=${CALLERID(num)})
 same => n,GotoIf($["${VMEN}" = "1"]?vm:done)
 same => n(vm),Answer()
 same => n,Set(VMMODE=u)
 same => n,ExecIf($["${DIALSTATUS}" = "BUSY"]?Set(VMMODE=b))
 ; VoiceMail() only stores a message if the caller actually leaves one; the
 ; resulting "new voicemail" notification is enqueued by externnotify
 ; (voicemail.conf -> vm-notify.sh), which fires exactly when a message saves.
 same => n,VoiceMail(${TARGET}@${TENANT},${VMMODE})
 same => n,Hangup()
 same => n(done),Hangup()
 same => n(invalid),Playback(pbx-invalid)
 same => n,Hangup()

; ----------------------------------------------------------------------------
;  Ring group (ringall) with failover destination
; ----------------------------------------------------------------------------
[ringgroup-exec]
exten => _X.,1,NoOp(Ring group ${EXTEN} @ ${TENANT})
 same => n,Set(RG=${ODBC_RG_INFO(${TENANT},${EXTEN})})
 same => n,GotoIf($["${RG}" = ""]?invalid)
 same => n,Set(RINGT=${CUT(RG,^,2)})
 same => n,Set(MEMBERS=${CUT(RG,^,3)})
 same => n,Set(FT=${CUT(RG,^,4)})
 same => n,Set(FV=${CUT(RG,^,5)})
 same => n,Set(DSTR=)
 same => n,Set(IDX=1)
 same => n(loop),Set(M=${CUT(MEMBERS,\,,${IDX})})
 same => n,GotoIf($["${M}" = ""]?dial)
 same => n,Set(DSTR=${IF($["${DSTR}" = ""]?PJSIP/${TENANT}-${M}:${DSTR}&PJSIP/${TENANT}-${M})})
 same => n,Set(IDX=$[${IDX} + 1])
 same => n,Goto(loop)
 same => n(dial),GotoIf($["${DSTR}" = ""]?failover)
 same => n,Dial(${DSTR},${RINGT},${DIAL_OPTS})
 same => n(failover),Set(DEST_VALUE=${FV})
 same => n,Goto(dispatch,${FT},1)
 same => n(invalid),Playback(pbx-invalid)
 same => n,Hangup()

; ----------------------------------------------------------------------------
;  Call queue (ACD) — realtime app_queue; name = "<slug>-<num>"
; ----------------------------------------------------------------------------
[queue-exec]
exten => _X.,1,NoOp(Queue ${TENANT}-${EXTEN})
 same => n,Answer()
 same => n,Queue(${TENANT}-${EXTEN},${DIAL_OPTS})
 same => n,Hangup()

; ----------------------------------------------------------------------------
;  IVR / auto-attendant
; ----------------------------------------------------------------------------
[ivr-exec]
exten => _X.,1,NoOp(IVR ${EXTEN} @ ${TENANT})
 same => n,Set(IV=${ODBC_IVR_INFO(${TENANT},${EXTEN})})
 same => n,GotoIf($["${IV}" = ""]?invalid)
 same => n,Set(IVRNUM=${EXTEN})
 same => n,Set(IVRID=${CUT(IV,^,1)})
 same => n,Set(GREET=${CUT(IV,^,2)})
 same => n,Set(TMO=${CUT(IV,^,3)})
 same => n,Set(MAXRETRY=${CUT(IV,^,4)})
 same => n,Set(INVT=${CUT(IV,^,6)})
 same => n,Set(INVV=${CUT(IV,^,7)})
 same => n,Set(TOT=${CUT(IV,^,8)})
 same => n,Set(TOV=${CUT(IV,^,9)})
 same => n,Answer()
 same => n,Set(TRY=0)
 same => n(menu),Set(TRY=$[${TRY} + 1])
 same => n,GotoIf($[${TRY} > ${MAXRETRY}]?timeout)
 same => n,Background(${GREET})
 same => n,WaitExten(${TMO})
 same => n,Goto(timeout)
 same => n(timeout),Set(DEST_VALUE=${TOV})
 same => n,Goto(dispatch,${TOT},1)
 same => n(invalid),Set(DEST_VALUE=${INVV})
 same => n,Goto(dispatch,${INVT},1)

; single-digit menu options
exten => _[0-9*#],1,Set(OPT=${ODBC_IVR_OPT(${IVRID},${EXTEN})})
 same => n,GotoIf($["${OPT}" = ""]?bad)
 same => n,Set(DEST_VALUE=${CUT(OPT,^,2)})
 same => n,Goto(dispatch,${CUT(OPT,^,1)},1)
 same => n(bad),Playback(pbx-invalid)
 same => n,Goto(ivr-exec,${IVRNUM},menu)

; direct-dial extensions from within the IVR (3-5 digits)
exten => _XXX,1,GotoIf($["${ODBC_EXT_INFO(${TENANT},${EXTEN})}" = ""]?bad,1)
 same => n,Goto(ext-dial,${EXTEN},1)
exten => _XXXX,1,GotoIf($["${ODBC_EXT_INFO(${TENANT},${EXTEN})}" = ""]?bad,1)
 same => n,Goto(ext-dial,${EXTEN},1)
exten => _XXXXX,1,GotoIf($["${ODBC_EXT_INFO(${TENANT},${EXTEN})}" = ""]?bad,1)
 same => n,Goto(ext-dial,${EXTEN},1)
exten => i,1,Playback(pbx-invalid)
 same => n,Goto(ivr-exec,${IVRNUM},menu)
exten => t,1,Goto(ivr-exec,${IVRNUM},timeout)
exten => bad,1,Playback(pbx-invalid)
 same => n,Hangup()

; ----------------------------------------------------------------------------
;  Time condition (business-hours routing)
; ----------------------------------------------------------------------------
[tc-exec]
exten => _X.,1,NoOp(Time condition ${EXTEN} @ ${TENANT})
 same => n,Set(TC=${ODBC_TC_INFO(${TENANT},${EXTEN})})
 same => n,GotoIf($["${TC}" = ""]?invalid)
 same => n,Set(TCID=${CUT(TC,^,1)})
 same => n,Set(TZ=${CUT(TC,^,2)})
 same => n,Set(MT=${CUT(TC,^,3)})
 same => n,Set(MV=${CUT(TC,^,4)})
 same => n,Set(NT=${CUT(TC,^,5)})
 same => n,Set(NV=${CUT(TC,^,6)})
 same => n,Set(RANGES=${ODBC_TC_RANGES(${TCID})})
 same => n,Set(IDX=1)
 same => n(rloop),Set(R=${CUT(RANGES,|,${IDX})})
 same => n,GotoIf($["${R}" = ""]?nomatch)
 same => n,Set(T=${CUT(R,\,,1)})
 same => n,Set(WD=${CUT(R,\,,2)})
 same => n,Set(MD=${CUT(R,\,,3)})
 same => n,Set(MO=${CUT(R,\,,4)})
 same => n,GotoIfTime(${T},${WD},${MD},${MO},${TZ}?match)
 same => n,Set(IDX=$[${IDX} + 1])
 same => n,Goto(rloop)
 same => n(match),Set(DEST_VALUE=${MV})
 same => n,Goto(dispatch,${MT},1)
 same => n(nomatch),Set(DEST_VALUE=${NV})
 same => n,Goto(dispatch,${NT},1)
 same => n(invalid),Playback(pbx-invalid)
 same => n,Hangup()

; ----------------------------------------------------------------------------
;  Voicemail drop / playback helpers
; ----------------------------------------------------------------------------
[vm-exec]
exten => _X.,1,Answer()
 same => n,VoiceMail(${EXTEN}@${TENANT},u)
 same => n,Hangup()

[playback-exec]
exten => _.,1,Answer()
 same => n,Playback(${EXTEN})
 same => n,Hangup()

; ----------------------------------------------------------------------------
;  Outbound to the PSTN through a trunk (Twilio termination)
; ----------------------------------------------------------------------------
[outbound]
exten => _X.,1,NoOp(Outbound ${EXTEN} @ ${TENANT})
 same => n,Set(CDR(direction)=outbound)
 same => n,GoSub(start-recording,s,1)
 same => n,Set(OUT=${ODBC_OUTBOUND(${TENANT},${EXTEN})})
 same => n,GotoIf($["${OUT}" = ""]?noroute)
 same => n,Set(TRUNKEP=${CUT(OUT,^,1)})
 same => n,Set(RCID=${CUT(OUT,^,2)})
 same => n,Set(STRIP=${CUT(OUT,^,3)})
 same => n,Set(PRE=${CUT(OUT,^,4)})
 same => n,Set(NUM=${EXTEN})
 same => n,ExecIf($[${STRIP} > 0]?Set(NUM=${NUM:${STRIP}}))
 same => n,Set(NUM=${PRE}${NUM})
 same => n,ExecIf($["${RCID}" != ""]?Set(CALLERID(num)=${RCID}))
 same => n,Set(CALLERID(name)=${CALLERID(num)})
 same => n,Dial(PJSIP/${NUM}@${TRUNKEP},60,${DIAL_OPTS})
 same => n,Hangup()
 same => n(noroute),NoOp(No outbound route for ${EXTEN} tenant ${TENANT})
 same => n,Playback(ss-noservice)
 same => n,Hangup()

; ----------------------------------------------------------------------------
;  Catch-all
; ----------------------------------------------------------------------------
[default]
exten => _.,1,Hangup()
exten => i,1,Hangup()
exten => t,1,Hangup()

; ----------------------------------------------------------------------------
;  Per-tenant generated contexts (BLF hints). Each tenant-<slug> context
;  includes from-internal and declares hints for that tenant's extensions so
;  desk phones can SUBSCRIBE for busy-lamp-field presence. Files are written
;  by the management API (api/app/dialplan_gen.py) to the shared dialplan
;  volume and applied with `dialplan reload`. The wildcard include is a no-op
;  until the first tenant file appears.
; ----------------------------------------------------------------------------
#include "dialplan/tenant-*.conf"
