; Installed to /etc/odbcinst.ini by the entrypoint. Driver path matches the
; odbc-postgresql package on Ubuntu 22.04 (same x86_64 multiarch location).
[PostgreSQL]
Description = PostgreSQL ODBC driver (Unicode)
Driver      = /usr/lib/x86_64-linux-gnu/odbc/psqlodbcw.so
Setup       = /usr/lib/x86_64-linux-gnu/odbc/libodbcpsqlS.so
FileUsage   = 1
Threading   = 2
