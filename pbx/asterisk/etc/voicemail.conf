; ============================================================================
;  voicemail.conf — mailbox *users* live in the realtime `voicemail` table
;  (context == tenant slug, mailbox == extension). This file only holds the
;  global behaviour + email templating.
; ============================================================================
[general]
format = wav49|gsm|wav
attach = yes
maxmsg = 100
maxsecs = 300
minsecs = 2
maxgreet = 60
skipms = 3000
maxsilence = 10
silencethreshold = 128
sendvoicemail = yes
review = yes
operator = yes
envelope = yes
moveheard = yes
; multi-tenant friendly: identify boxes as mailbox@context (context = slug)
searchcontexts = no
; Fire our notifier when a message is stored/changed. Asterisk calls:
;   vm-notify.sh <context(slug)> <mailbox(exten)> <newcount> <oldcount> [from]
; The script enqueues a 'voicemail' row into the notifications outbox (only
; when newcount increased), which the API worker then delivers (email/SMS).
externnotify = /etc/asterisk/scripts/vm-notify.sh
fromstring = OpenPBX Voicemail
emailsubject = [Voicemail] New ${VM_DUR} message from ${VM_CALLERID}
emailbody = Hi ${VM_NAME},\n\nYou received a ${VM_DUR} voicemail (msg ${VM_MSGNUM}) from ${VM_CALLERID} on ${VM_DATE}.\n\n— OpenPBX
mailcmd = /usr/sbin/sendmail -t

; Zonemessages let mailbox owners hear times in their own tz.
[zonemessages]
eastern = America/New_York|'vm-received' Q 'digits/at' IMp
central = America/Chicago|'vm-received' Q 'digits/at' IMp
pacific = America/Los_Angeles|'vm-received' Q 'digits/at' IMp
