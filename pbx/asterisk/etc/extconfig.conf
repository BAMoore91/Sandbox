; ============================================================================
;  extconfig.conf — map Asterisk "families" to ODBC-backed realtime tables.
;  The left side is the family Asterisk asks for; the right side is
;  "<engine>,<res_odbc context>,<table>".  Our res_odbc context is "openpbx".
; ============================================================================
[settings]

; ---- PJSIP realtime objects ----------------------------------------------
ps_endpoints       => odbc,openpbx,ps_endpoints
ps_auths           => odbc,openpbx,ps_auths
ps_aors            => odbc,openpbx,ps_aors
ps_contacts        => odbc,openpbx,ps_contacts
ps_endpoint_id_ips => odbc,openpbx,ps_endpoint_id_ips
ps_registrations   => odbc,openpbx,ps_registrations

; ---- Voicemail users in realtime -----------------------------------------
voicemail          => odbc,openpbx,voicemail

; ---- ACD queues + members in realtime (app_queue) ------------------------
queues             => odbc,openpbx,queues
queue_members      => odbc,openpbx,queue_members
