; ============================================================================
;  sorcery.conf — tell res_pjsip's object layer to source objects from
;  realtime (ODBC) instead of flat files. Transports stay in pjsip.conf.
; ============================================================================
[res_pjsip]
endpoint     = realtime,ps_endpoints
auth         = realtime,ps_auths
aor          = realtime,ps_aors
; Dynamic contacts (REGISTER) are persisted so registrations survive
; restarts and are visible to the management API.
contact      = realtime,ps_contacts

[res_pjsip_endpoint_identifier_ip]
identify     = realtime,ps_endpoint_id_ips

[res_pjsip_outbound_registration]
registration = realtime,ps_registrations
