; ============================================================================
;  func_odbc.conf — dialplan <-> database lookup functions.
;  All read-only. Each returns a single string; multi-column results are
;  packed with '^' separators and split with CUT() in extensions.conf.
;  Args:  ${ARG1}, ${ARG2}, ...   are escaped with ${SQL_ESC()}.
; ============================================================================

; ---- Inbound: resolve a DID to its tenant + destination -------------------
; ${ODBC_DID_INFO(<e164>)}  ->  "<slug>^<dest_type>^<dest_value>"
[DID_INFO]
dsn=openpbx
readsql=SELECT t.slug || '^' || d.dest_type || '^' || d.dest_value \
        FROM dids d JOIN tenants t ON t.id = d.tenant_id \
        WHERE d.number = '${SQL_ESC(${ARG1})}' AND d.enabled \
        AND t.status = 'active' LIMIT 1

; ---- Extension metadata ---------------------------------------------------
; ${ODBC_EXT_INFO(<slug>,<ext>)} -> "<ring>^<vm?>^<cfwd>^<dnd?>^<name>"
[EXT_INFO]
dsn=openpbx
readsql=SELECT e.ring_seconds || '^' || \
          (CASE WHEN e.voicemail_enabled THEN '1' ELSE '0' END) || '^' || \
          COALESCE(e.call_forward,'') || '^' || \
          (CASE WHEN e.dnd THEN '1' ELSE '0' END) || '^' || \
          COALESCE(e.display_name,'') \
        FROM extensions e JOIN tenants t ON t.id = e.tenant_id \
        WHERE t.slug = '${SQL_ESC(${ARG1})}' AND e.extension = '${SQL_ESC(${ARG2})}' LIMIT 1

; ---- Ring group -----------------------------------------------------------
; ${ODBC_RG_INFO(<slug>,<num>)} -> "<strategy>^<ring>^<members>^<failType>^<failVal>"
[RG_INFO]
dsn=openpbx
readsql=SELECT r.strategy || '^' || r.ring_seconds || '^' || r.members || '^' || \
          r.fail_dest_type || '^' || COALESCE(r.fail_dest_value,'') \
        FROM ring_groups r JOIN tenants t ON t.id = r.tenant_id \
        WHERE t.slug = '${SQL_ESC(${ARG1})}' AND r.number = '${SQL_ESC(${ARG2})}' \
        AND r.enabled LIMIT 1

; ---- IVR -----------------------------------------------------------------
; ${ODBC_IVR_INFO(<slug>,<num>)} ->
;   "<id>^<greeting>^<timeout>^<retries>^<direct?>^<invType>^<invVal>^<toType>^<toVal>"
[IVR_INFO]
dsn=openpbx
readsql=SELECT i.id || '^' || i.greeting || '^' || i.timeout || '^' || i.max_retries || '^' || \
          (CASE WHEN i.direct_dial THEN '1' ELSE '0' END) || '^' || \
          i.invalid_dest_type || '^' || COALESCE(i.invalid_dest_value,'') || '^' || \
          i.timeout_dest_type || '^' || COALESCE(i.timeout_dest_value,'') \
        FROM ivr_menus i JOIN tenants t ON t.id = i.tenant_id \
        WHERE t.slug = '${SQL_ESC(${ARG1})}' AND i.number = '${SQL_ESC(${ARG2})}' LIMIT 1

; ${ODBC_IVR_OPT(<ivr_id>,<digit>)} -> "<dest_type>^<dest_value>"
[IVR_OPT]
dsn=openpbx
readsql=SELECT dest_type || '^' || dest_value FROM ivr_options \
        WHERE ivr_id = ${SQL_ESC(${ARG1})} AND digit = '${SQL_ESC(${ARG2})}' LIMIT 1

; ---- Time condition -------------------------------------------------------
; ${ODBC_TC_INFO(<slug>,<num>)} ->
;   "<id>^<tz>^<matchType>^<matchVal>^<nomatchType>^<nomatchVal>"
[TC_INFO]
dsn=openpbx
readsql=SELECT c.id || '^' || COALESCE(c.timezone, t.timezone) || '^' || \
          c.match_dest_type || '^' || c.match_dest_value || '^' || \
          c.nomatch_dest_type || '^' || c.nomatch_dest_value \
        FROM time_conditions c JOIN tenants t ON t.id = c.tenant_id \
        WHERE t.slug = '${SQL_ESC(${ARG1})}' AND c.number = '${SQL_ESC(${ARG2})}' LIMIT 1

; ${ODBC_TC_RANGES(<tc_id>)} -> "times,wdays,mdays,months|times,wdays,..."
[TC_RANGES]
dsn=openpbx
readsql=SELECT string_agg(times || ',' || weekdays || ',' || monthdays || ',' || months, '|') \
        FROM time_ranges WHERE time_condition_id = ${SQL_ESC(${ARG1})}

; ---- Holidays for a time condition ----------------------------------------
; ${ODBC_TC_HOLIDAYS(<tc_id>)} -> one entry per enabled holiday, '|'-separated:
;   times~mday~mon~year~destType~destValue
;   - times: '*' or HH:MM-HH:MM        (GotoIfTime time spec)
;   - mday/mon: numeric day / month    (GotoIfTime monthday/month)
;   - year: numeric for one-off, '*' for recurring (matched in dialplan)
;   - destType/destValue: '' when the holiday uses the TC's closed destination
[TC_HOLIDAYS]
dsn=openpbx
readsql=SELECT string_agg( \
          times || '~' || day || '~' || month || '~' || \
          (CASE WHEN recurring THEN '*' ELSE COALESCE(year::text,'*') END) || '~' || \
          COALESCE(dest_type,'') || '~' || COALESCE(dest_value,''), '|') \
        FROM holidays WHERE time_condition_id = ${SQL_ESC(${ARG1})} AND enabled

; ---- Outbound route selection (longest-priority POSIX-regex match) --------
; ${ODBC_OUTBOUND(<slug>,<dialed>)} -> "<trunkEndpoint>^<cid>^<strip>^<prepend>"
[OUTBOUND]
dsn=openpbx
readsql=SELECT tr.endpoint_id || '^' || COALESCE(o.caller_id,'') || '^' || \
          o.strip_digits || '^' || COALESCE(o.prepend,'') \
        FROM outbound_routes o \
          JOIN trunks tr ON tr.id = o.trunk_id AND tr.enabled \
          JOIN tenants t ON t.id = o.tenant_id \
        WHERE t.slug = '${SQL_ESC(${ARG1})}' AND o.enabled \
          AND '${SQL_ESC(${ARG2})}' ~ o.regexp \
        ORDER BY o.priority ASC LIMIT 1

; ---- Queue existence (name convention "<slug>-<num>") ---------------------
; ${ODBC_QUEUE_EXISTS(<slug>,<num>)} -> queue name or ""
[QUEUE_EXISTS]
dsn=openpbx
readsql=SELECT name FROM queues WHERE name = '${SQL_ESC(${ARG1})}-${SQL_ESC(${ARG2})}' LIMIT 1

; ---- Tenant id (for CDR tagging) ------------------------------------------
[TENANT_ID]
dsn=openpbx
readsql=SELECT id FROM tenants WHERE slug = '${SQL_ESC(${ARG1})}' LIMIT 1

; ---- Recording flag (1 if the tenant has call recording enabled) ----------
; ${ODBC_REC_ENABLED(<slug>)} -> '1' or ''
[REC_ENABLED]
dsn=openpbx
readsql=SELECT '1' FROM tenants WHERE slug = '${SQL_ESC(${ARG1})}' \
        AND recording_enabled LIMIT 1

; ---- Insert a recording catalog row (write) -------------------------------
; Write a catalog row. func_odbc uses writesql when the function is assigned
; to (Set(ODBC_REC_INSERT(uid,path,src,dst)=<tenant_id>)); ${VAL1} is the
; assigned value, ${ARG1..} are the call arguments.
[REC_INSERT]
dsn=openpbx
synopsis=Insert a call-recording catalog row
writesql=INSERT INTO recordings (tenant_id, uniqueid, path, src, dst) \
         VALUES (${SQL_ESC(${VAL1})}, '${SQL_ESC(${ARG1})}', \
                 '${SQL_ESC(${ARG2})}', '${SQL_ESC(${ARG3})}', '${SQL_ESC(${ARG4})}')

; ---- Enqueue a notification (missed call / voicemail) ---------------------
; Assignment form: Set(ODBC_NOTIFY(<slug>,<exten>,<event>,<did>)=<caller>)
;   ARG1=slug  ARG2=extension  ARG3=event(missed|voicemail)  ARG4=did
;   VAL1=caller number
; Fans out one outbox row per enabled channel (email/sms) for the extension,
; honoring per-event + per-channel prefs. Subject/body composed here.
[NOTIFY]
dsn=openpbx
synopsis=Enqueue missed-call / voicemail notifications
writesql=INSERT INTO notifications \
           (tenant_id, extension, event, channel, recipient, subject, body, caller, did) \
         SELECT e.tenant_id, e.extension, '${SQL_ESC(${ARG3})}', ch.channel, ch.recipient, \
           CASE WHEN '${SQL_ESC(${ARG3})}' = 'voicemail' \
                THEN 'New voicemail for ' || e.extension \
                ELSE 'Missed call for ' || e.extension END, \
           CASE WHEN '${SQL_ESC(${ARG3})}' = 'voicemail' \
                THEN 'New voicemail on extension ' || e.extension || ' from ' \
                     || COALESCE(NULLIF('${SQL_ESC(${VAL1})}',''),'unknown') \
                ELSE 'Missed call on extension ' || e.extension || ' from ' \
                     || COALESCE(NULLIF('${SQL_ESC(${VAL1})}',''),'unknown') END, \
           NULLIF('${SQL_ESC(${VAL1})}',''), NULLIF('${SQL_ESC(${ARG4})}','') \
         FROM extensions e JOIN tenants t ON t.id = e.tenant_id \
         CROSS JOIN LATERAL (VALUES \
            ('email', COALESCE(NULLIF(e.notify_email,''), e.email), e.notify_channel_email), \
            ('sms',   e.notify_sms, e.notify_channel_sms) \
         ) AS ch(channel, recipient, enabled) \
         WHERE t.slug = '${SQL_ESC(${ARG1})}' AND e.extension = '${SQL_ESC(${ARG2})}' \
           AND ch.enabled AND ch.recipient IS NOT NULL AND ch.recipient <> '' \
           AND ( ('${SQL_ESC(${ARG3})}' = 'missed'    AND e.notify_on_missed) \
              OR ('${SQL_ESC(${ARG3})}' = 'voicemail' AND e.notify_on_voicemail) )
