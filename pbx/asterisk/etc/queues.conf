; ============================================================================
;  queues.conf — global app_queue settings. Individual queues + members are
;  loaded from the realtime `queues` / `queue_members` tables (extconfig.conf),
;  named "<tenant_slug>-<number>".
; ============================================================================
[general]
persistentmembers = yes
autofill = yes
monitor-type = MixMonitor
shared_lastcall = no
negative_penalty_invalid = yes
