worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    upstream api { server api:8000; }
    upstream web { server web:80; }

    # Redirect plain HTTP to HTTPS
    server {
        listen 80;
        server_name _;
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        server_name _;

        # Same cert volume Asterisk uses (self-signed on first boot).
        ssl_certificate     /etc/nginx/keys/fullchain.pem;
        ssl_certificate_key /etc/nginx/keys/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Internal-only API (e.g. externnotify enqueue) — never expose it.
        # Reachable only on the private docker network, not through the proxy.
        location /api/internal/ {
            return 404;
        }

        # Wallboard SSE stream — disable buffering so events flush live.
        location ~ ^/api/tenants/[0-9]+/wallboard/stream {
            proxy_pass         http://api;
            proxy_set_header   Host $host;
            proxy_set_header   Connection "";
            proxy_http_version 1.1;
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;
        }

        # Management API
        location /api/ {
            proxy_pass         http://api;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # allow customer prompt uploads (audio files)
            client_max_body_size 20m;
        }

        # React admin portal + softphone (static)
        location / {
            proxy_pass        http://web;
            proxy_set_header  Host $host;
        }
    }
}
